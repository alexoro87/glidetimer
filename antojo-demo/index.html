<title>Antojo Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a phone (customer) beside a tablet (restaurant) on one stage; on narrow screens a switch shows one at a time. */
:root {
  --bg: #E9EEE8; --surface: #FFFFFF; --surface-2: #F5F7F4; --ink: #16201A; --muted: #56625A;
  --line: #DCE2DC; --line-2: #EEF1ED;
  --accent: #D93A22; --on-accent: #FFFFFF; --accent-soft: #FCE7E2; --accent-text: #A42A16;
  --ok: #1E5B43; --on-ok: #FFFFFF; --ok-soft: #E3EFE8; --ok-text: #1E5B43;
  --side: #16201A; --side-ink: #C9D3CB; --side-active: #2C3830; --side-muted: #A9B5AC;
  --frame: #16201A; --chip: #16201A; --on-chip: #FFFFFF; --track: #C9D1CA;
  --map: #E3E9E2; --street: #FFFFFF; --park: #CFDCCB;
  --shadow: 0 20px 50px rgba(22, 32, 26, .16);
  --display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1310; --surface: #18201B; --surface-2: #121813; --ink: #E6ECE7; --muted: #9BA89F;
    --line: #2A352D; --line-2: #202A23;
    --accent: #D93A22; --on-accent: #FFFFFF; --accent-soft: #3A1E18; --accent-text: #FF9A85;
    --ok: #2B7A57; --on-ok: #FFFFFF; --ok-soft: #183026; --ok-text: #86D6B0;
    --side: #0A0E0B; --side-ink: #B9C4BC; --side-active: #202A23; --side-muted: #7F8C83;
    --frame: #2A352D; --chip: #E6ECE7; --on-chip: #121813; --track: #3A463D;
    --map: #1B241E; --street: #2A352D; --park: #21342A;
    --shadow: 0 20px 50px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1310; --surface: #18201B; --surface-2: #121813; --ink: #E6ECE7; --muted: #9BA89F;
  --line: #2A352D; --line-2: #202A23;
  --accent: #D93A22; --on-accent: #FFFFFF; --accent-soft: #3A1E18; --accent-text: #FF9A85;
  --ok: #2B7A57; --on-ok: #FFFFFF; --ok-soft: #183026; --ok-text: #86D6B0;
  --side: #0A0E0B; --side-ink: #B9C4BC; --side-active: #202A23; --side-muted: #7F8C83;
  --frame: #2A352D; --chip: #E6ECE7; --on-chip: #121813; --track: #3A463D;
  --map: #1B241E; --street: #2A352D; --park: #21342A;
  --shadow: 0 20px 50px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.4; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

.page { max-width: 1440px; margin: 0 auto; padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.logo { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: -0.02em; }
.tag { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); background: var(--accent-soft); padding: 4px 10px; border-radius: 999px; }
.lede { margin: 0; flex: 1 1 360px; min-width: 0; color: var(--muted); max-width: 62ch; }
.top-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ghost { height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; }
.ghost.armed { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent); }
.seg { display: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { height: 36px; padding: 0 14px; border-radius: 9px; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.seg button[aria-selected="true"] { background: var(--chip); color: var(--on-chip); }
.seg .badge { background: var(--accent); color: var(--on-accent); border-radius: 999px; font-size: 11px; min-width: 18px; height: 18px; padding: 0 5px; display: inline-grid; place-items: center; }

.stage { display: flex; gap: 28px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col-client { flex: none; }
.col-resto { flex: 1; }
.col-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

.phone { position: relative; width: 390px; height: 800px; border-radius: 40px; border: 10px solid var(--frame); background: var(--surface-2); overflow: hidden; box-shadow: var(--shadow); }
.tablet { position: relative; height: 800px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface-2); overflow: hidden; box-shadow: var(--shadow); }
.app, .panel { height: 100%; display: flex; flex-direction: column; }
.scr { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }

.toast-host { position: absolute; left: 12px; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; z-index: 5; }
.toast { background: var(--chip); color: var(--on-chip); padding: 10px 14px; border-radius: 12px; font-weight: 600; font-size: 13px; box-shadow: var(--shadow); max-width: 100%; animation: tin .25s ease-out; }
#resto-toasts { top: auto; bottom: 16px; }
.toast.out { opacity: 0; transform: translateY(-6px); transition: .3s; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }

/* ---------- Client app ---------- */
.c-pad { display: flex; flex-direction: column; gap: 16px; padding: 18px 18px 24px; }
.c-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.eyebrow { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.addr { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 4px; }
.round { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; flex: none; }
.c-title { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -0.02em; }
.search { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; height: 48px; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: var(--ink); }
.search:focus-within { border-color: var(--ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 0 18px; }
.chip { flex: none; height: 38px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--surface); border: 1px solid var(--line); }
.chip[aria-pressed="true"] { background: var(--chip); color: var(--on-chip); border-color: var(--chip); }
.live-banner { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--accent-soft); color: var(--accent-text); border-radius: 16px; padding: 12px 14px; }
.live-banner b { display: block; color: var(--ink); }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.promo { background: var(--ok); color: var(--on-ok); border-radius: 18px; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.promo strong { font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1.1; display: block; }
.promo span { font-size: 13px; opacity: .9; }
.promo .zero { flex: none; width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 18px; }
.h2 { font-family: var(--display); font-weight: 600; font-size: 19px; }
.rlist { display: flex; flex-direction: column; gap: 18px; }
.rcard { display: flex; flex-direction: column; gap: 10px; text-align: left; width: 100%; }
.photo { position: relative; border-radius: 16px; height: 140px; width: 100%; overflow: hidden; }
.photo .lbl { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: #FFFFFF; opacity: .85; }
.photo .pill { position: absolute; right: 10px; top: 10px; background: #FFFFFF; color: #16201A; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
.photo .closed { position: absolute; inset: 0; background: rgba(15, 20, 17, .62); color: #FFFFFF; display: grid; place-items: center; font-weight: 600; }
.rrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.rname { font-weight: 600; font-size: 16px; display: block; }
.rmeta { font-size: 13px; color: var(--muted); }
.rating { flex: none; background: var(--line-2); border-radius: 999px; padding: 4px 10px; font-weight: 600; font-size: 13px; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; display: flex; flex-direction: column; gap: 12px; align-items: center; }

.tabbar { flex: none; height: 70px; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding-bottom: 6px; }
.tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--muted); position: relative; }
.tabbar button[aria-current="page"] { color: var(--accent-text); font-weight: 600; }
.tabbar .dot { position: absolute; top: 10px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 11px; display: grid; place-items: center; font-weight: 600; }

.cover { position: relative; height: 180px; flex: none; }
.cover .round { position: absolute; top: 14px; left: 14px; }
.cover .lbl { position: absolute; left: 18px; bottom: 40px; font-size: 11px; color: #FFFFFF; opacity: .85; }
.sheet { position: relative; margin-top: -26px; background: var(--surface-2); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 16px; padding: 20px 18px 24px; }
.r-title { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.stats div { display: flex; flex-direction: column; align-items: center; padding: 10px 4px; gap: 1px; }
.stats div + div { border-left: 1px solid var(--line); }
.stats b { font-size: 15px; }
.stats span { font-size: 11px; color: var(--muted); }
.notice { background: var(--accent-soft); color: var(--accent-text); border-radius: 12px; padding: 10px 12px; font-weight: 600; font-size: 13px; }
.sec { font-family: var(--display); font-weight: 600; font-size: 17px; padding-top: 4px; }
.item { display: flex; gap: 14px; align-items: center; }
.item.off { opacity: .55; }
.item .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item .nm { font-weight: 600; font-size: 15px; }
.item .ds { font-size: 13px; color: var(--muted); }
.item .pr { font-weight: 600; }
.thumb { position: relative; flex: none; width: 88px; height: 88px; border-radius: 14px; }
.thumb .add { position: absolute; right: -6px; bottom: -6px; width: 38px; height: 38px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; }
.thumb .soldout { position: absolute; left: 6px; right: 6px; bottom: 6px; background: var(--surface); color: var(--ink); border-radius: 8px; text-align: center; font-size: 11px; font-weight: 600; padding: 3px 0; }
.thumb .step { position: absolute; right: -6px; bottom: -8px; }
.step { display: inline-flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.step button { width: 34px; height: 34px; display: grid; place-items: center; font-size: 18px; font-weight: 600; }
.step span { min-width: 18px; text-align: center; font-weight: 600; }
.bar-bottom { flex: none; padding: 12px 18px 16px; background: var(--surface-2); border-top: 1px solid var(--line); }
.cta { width: 100%; height: 54px; border-radius: 16px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; font-size: 15px; padding: 0 18px; }
.cta.split { justify-content: space-between; }
.cta:disabled { background: var(--track); color: var(--muted); }
.cta .count { background: var(--on-accent); color: var(--accent); border-radius: 999px; min-width: 26px; height: 26px; display: grid; place-items: center; font-size: 13px; }

.topbar { display: flex; align-items: center; gap: 12px; }
.topbar h1 { font-family: var(--display); font-weight: 800; font-size: 23px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.line { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.line + .line { border-top: 1px solid var(--line); }
.line .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.line small { color: var(--muted); font-size: 12px; }
.line .amt { width: 56px; text-align: right; font-weight: 600; }
.tips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tips button { height: 42px; border-radius: 12px; font-weight: 600; background: var(--surface); border: 1px solid var(--line); }
.tips button[aria-pressed="true"] { background: var(--ok); color: var(--on-ok); border-color: var(--ok); }
.sum { display: flex; flex-direction: column; gap: 7px; }
.sum div { display: flex; justify-content: space-between; color: var(--muted); }
.sum .total { color: var(--ink); font-weight: 600; font-size: 17px; border-top: 1px solid var(--line); padding-top: 10px; }
.link { color: var(--accent-text); font-weight: 600; font-size: 13px; }

.map { position: relative; height: 300px; flex: none; }
.map svg { display: block; width: 100%; height: 100%; }
.map .round { position: absolute; top: 14px; left: 14px; }
.m-bg { fill: var(--map); } .m-st { fill: var(--street); } .m-pk { fill: var(--park); }
.m-route { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 10; }
.m-rest { fill: var(--ink); } .m-home { fill: var(--ok); } .m-cour { fill: var(--accent); stroke: var(--surface); stroke-width: 3; } .m-w { fill: #FFFFFF; }
.track { margin-top: -22px; position: relative; background: var(--surface-2); border-radius: 22px 22px 0 0; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.track h1 { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: -0.02em; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.steps div { display: flex; flex-direction: column; gap: 6px; font-size: 11px; color: var(--muted); }
.steps i { display: block; height: 6px; border-radius: 3px; background: var(--line); }
.steps .done i { background: var(--accent); }
.steps .now { color: var(--ink); font-weight: 600; }
.courier { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--ok); color: var(--on-ok); display: grid; place-items: center; font-weight: 600; flex: none; }
.orow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; }
.orow + .orow { border-top: 1px solid var(--line); }
.status { flex: none; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--line-2); color: var(--ink); }
.status.hot { background: var(--accent-soft); color: var(--accent-text); }
.status.good { background: var(--ok-soft); color: var(--ok-text); }

/* ---------- Restaurant panel ---------- */
.r-shell { height: 100%; display: flex; }
.r-side { width: 190px; flex: none; background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; gap: 6px; padding: 22px 12px; }
.r-brand { padding: 0 10px 18px; display: flex; flex-direction: column; gap: 2px; }
.r-brand b { font-family: var(--display); font-weight: 800; font-size: 21px; color: #FFFFFF; }
.r-brand span { font-size: 12px; color: var(--side-muted); }
.r-tab { height: 44px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; color: var(--side-ink); text-align: left; }
.r-tab[aria-current="page"] { background: var(--side-active); color: #FFFFFF; font-weight: 600; }
.r-tab .badge { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; }
.r-main { padding: 22px 24px 28px; display: flex; flex-direction: column; gap: 18px; }
.r-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.r-head h1 { font-family: var(--display); font-weight: 800; font-size: 27px; }
.r-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.switch { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 13px; }
.knob { position: relative; width: 38px; height: 22px; border-radius: 999px; background: var(--track); flex: none; transition: background .2s; }
.knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF; transition: left .2s; }
[aria-pressed="true"] > .knob { background: var(--ok); }
[aria-pressed="true"] > .knob::after { left: 19px; }
.kanban { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.lane { display: flex; flex-direction: column; gap: 10px; background: var(--line-2); border-radius: 16px; padding: 12px; min-width: 0; }
.lane.new { background: var(--accent-soft); }
.lane h2 { font-size: 14px; font-weight: 600; padding: 2px 2px 0; }
.lane.new h2 { color: var(--accent-text); }
.ocard { background: var(--surface); border-radius: 12px; padding: 13px; display: flex; flex-direction: column; gap: 9px; }
.ocard.fresh { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 4px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.ocard .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ocard .id { font-weight: 600; font-size: 15px; }
.ocard .when { font-size: 12px; font-weight: 600; color: var(--muted); }
.ocard .who { font-size: 12px; color: var(--muted); }
.ocard ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.ocard .ft { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 9px; flex-wrap: wrap; }
.prep { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.prep button { height: 34px; border-radius: 9px; border: 1px solid var(--line); font-size: 12px; font-weight: 600; }
.prep button[aria-pressed="true"] { background: var(--chip); color: var(--on-chip); border-color: var(--chip); }
.btns { display: flex; gap: 8px; }
.b-sec { height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); font-weight: 600; font-size: 13px; }
.b-pri { height: 38px; padding: 0 14px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 13px; }
.b-ok { height: 42px; width: 100%; border-radius: 10px; background: var(--ok); color: var(--on-ok); font-weight: 600; }
.meter { height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); transition: width .5s linear; }
.lane-empty { font-size: 13px; color: var(--muted); padding: 6px 2px 4px; }
.hint { font-size: 12px; font-weight: 600; color: var(--ok-text); background: var(--ok-soft); border-radius: 10px; padding: 8px 10px; }
.done-list .orow { padding: 11px 14px; font-size: 13px; }

.mtable { overflow-x: auto; }
.mrow { display: grid; grid-template-columns: 48px minmax(0, 1fr) 150px 70px 130px; gap: 14px; align-items: center; padding: 10px 16px; min-width: 520px; }
.mrow + .mrow { border-top: 1px solid var(--line-2); }
.mrow.hd { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; padding-block: 12px; }
.mrow .sw { width: 44px; height: 44px; border-radius: 10px; }
.mrow.off .sw { opacity: .35; }
.mrow.off .nm { color: var(--muted); }
.mrow .nm { font-weight: 600; display: block; }
.mrow small { font-size: 12px; color: var(--muted); }
.mrow .avail { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 13px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }

  /* ---------- Simulation ---------- */
  function advance() {
    var now = Date.now(), changed = false;
    state.orders.forEach(function (o) {
      var live = o.restId === LIVE, r = restById(o.restId);
      if (!live && o.status === 'nuevo' && now - o.createdAt > 2500) {
        o.status = 'preparando'; o.acceptedAt = now; o.prepMin = 6; changed = true;
        if (o.mine) toast('client', r.name + ' aceptó tu pedido');
      } else if (!live && o.status === 'preparando' && now - o.acceptedAt > 9000) {
        o.status = 'listo'; o.readyAt = now; changed = true;
      } else if (o.status === 'listo' && now - o.readyAt > PICKUP) {
        o.status = 'en_camino'; o.pickedAt = now; changed = true;
        if (o.mine) toast('client', o.courier + ' recogió tu pedido y va en camino');

    tip: function (d) { state.tip = Number(d.v); },
    inc: function (d) {
      var it = ITEMS[d.id];
      if (!isAvail(it.id)) return;

      if (!lines.length || !isOpen(state.cart.restId)) return;
      var id = 'A-' + state.counter++, rid = state.cart.restId, r = restById(rid);
      state.orders.push({ id: id, restId: rid, customer: 'Ana R.', address: 'Av. Reforma 222, depto. 5B', items: lines, tip: state.tip, status: 'nuevo', createdAt: Date.now(), courier: COURIERS[state.counter % 4], mine: true });
      state.cart = { restId: null, items: {} };
      state.trackId = id; state.screen = 'track';
      freshIds[id] = true;
      if (rid === LIVE) {
        toast('client', 'Pedido enviado. Acéptalo en el panel del restaurante.');
        toast('resto', 'Nuevo pedido #' + id + ' de Ana R.');
        state.restTab = 'pedidos';
      } else toast('client', 'Pedido enviado a ' + r.name);
    },
    rtab: function (d) { state.restTab = d.v; },
    toggleOpen: function () {
      state.open = !state.open;
      toast('resto', state.open ? 'Abriste el restaurante. Ya puedes recibir pedidos.' : 'Cerraste el restaurante. Los clientes no pueden pedir.');
    },
    prep: function (d) { var o = orderById(d.id); if (o) o.prepPick = Number(d.v); },
    accept: function (d) {
      var o = orderById(d.id); if (!o || o.status !== 'nuevo') return;
      o.status = 'preparando'; o.acceptedAt = Date.now(); o.prepMin = o.prepPick || 15;
      toast('resto', 'Pedido #' + o.id + ' aceptado · ' + o.prepMin + ' min');
      if (o.mine) toast('client', 'Taquería El Fogón aceptó tu pedido');
    },
    rejectAsk: function (d) { var o = orderById(d.id); if (o) o.confirmReject = true; },
    rejectNo: function (d) { var o = orderById(d.id); if (o) o.confirmReject = false; },
    rejectYes: function (d) {
      var o = orderById(d.id); if (!o || o.status !== 'nuevo') return;
      o.status = 'rechazado';
      toast('resto', 'Rechazaste el pedido #' + o.id);
      if (o.mine) toast('client', 'El restaurante no pudo aceptar tu pedido. No se te cobró.');
    },
    ready: function (d) {
      var o = orderById(d.id); if (!o || o.status !== 'preparando') return;
      o.status = 'listo'; o.readyAt = Date.now();
      toast('resto', 'Pedido #' + o.id + ' listo. Avisamos a ' + o.courier + '.');
      if (o.mine) toast('client', 'Tu pedido está listo. ' + o.courier + ' va por él.');
    },
    avail: function (d) {
      var it = ITEMS[d.id];
      state.avail[d.id] = !isAvail(d.id);
      toast('resto', it.name + (isAvail(d.id) ? ' vuelve a estar disponible' : ' marcado como agotado'));
    }
  };

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-action]');
    if (!b || b.disabled) return;
    var a = b.dataset.action;
    if (a === 'reset') {
      if (!b.classList.contains('armed')) {
        b.classList.add('armed'); b.textContent = '¿Seguro? Toca otra vez';
        clearTimeout(resetTimer);
        resetTimer = setTimeout(function () { b.classList.remove('armed'); b.textContent = 'Reiniciar demo'; }, 3000);
        return;
      }
      clearTimeout(resetTimer);
      b.classList.remove('armed'); b.textContent = 'Reiniciar demo';
      var mv = state.mview;
      state = freshState(); state.mview = mv; scrollMemo = {};
      save(); render();
      toast('client', 'Demo reiniciada');
      return;
    }
    if (!actions[a]) return;
    actions[a](b.dataset);
    save(); render();
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') {
      state.search = e.target.value;
      var l = document.getElementById('rlist');
      if (l) l.innerHTML = restList();
    }
  });

  render();
})();
</script>
